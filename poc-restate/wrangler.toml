# Cloudflare Workers configuration for Restate PoC
name = "restate-poc-port-scanner"

# Entrypoint
main = "./src/index.ts"

# Preview URLs are used to register to Restate
preview_urls = true

# Enable NodeJS compatibility (required by Restate SDK)
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]
